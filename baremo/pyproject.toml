[project]
name = "baremo"
version = "0.1.0"
description = "Estrategia de oferta para licitaciones públicas españolas: cuánto ofertar, cuántos puntos sacarás y el borrador de la oferta."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Alberto Deben Fernández" }]
# Versiones mínimas comprobadas el 2026-09-23 (ver docs/00-documento-de-diseno.md §6).
dependencies = [
    "anthropic>=1.8,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "duckdb>=1.5,<2",
    "httpx>=0.28,<1",
    "pypdf>=6.19,<7",
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "jinja2>=3.1,<4",
    "python-docx>=1.2,<2",
    "numpy>=2.0,<3",
    "scikit-learn>=1.9,<2",
    "mcp>=2.2,<3",
    "typer>=0.27,<1",
]

[project.scripts]
baremo = "baremo.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baremo"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # permitir tildes y comillas tipográficas en español

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["baremo"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "red: el test necesita acceso a Internet (PLACSP). Nunca se ejecuta en CI.",
    "llm: el test llama a la API de Anthropic y cuesta dinero. Nunca se ejecuta en CI.",
]
