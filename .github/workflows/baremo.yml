name: baremo

on:
  push:
    paths: ["baremo/**", ".github/workflows/baremo.yml"]
  pull_request:
    paths: ["baremo/**", ".github/workflows/baremo.yml"]

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baremo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not red and not llm"
